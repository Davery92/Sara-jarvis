server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Minimal config for proxy compatibility
    gzip off;

    # SPA - serve all requests, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
