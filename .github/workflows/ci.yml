name: CI

# The enforcement arm (Phase 11C) for the rules the audit prescribed:
# the naive-datetime ban, the main_simple.py line-count freeze, backend tests,
# and a fresh-clone `alembic upgrade head` against a scratch Postgres (which is
# what catches untracked-migration accidents like the 096-100 situation).

on:
  push:
    branches: [main, assistant-experience-jarvis]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Naive-datetime ban
        run: cd backend && python ../scripts/check_naive_datetime.py app
      - name: main_simple.py line freeze
        run: cd backend && python ../scripts/check_main_simple_lines.py app/main_simple.py
      - name: ruff (non-blocking)
        continue-on-error: true
        run: pip install ruff && ruff check backend/app || true

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sara_hub
          POSTGRES_USER: sara
          POSTGRES_PASSWORD: sara123
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sara -d sara_hub"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://sara:sara123@localhost:5432/sara_hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: cd backend && pip install -r requirements.txt
      - name: Fresh-clone alembic upgrade head (catches untracked migrations)
        run: cd backend && alembic upgrade head
      - name: Backend tests (best-effort — grow the passing set over time)
        continue-on-error: true
        run: cd backend && python -m pytest tests/ -q || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + typecheck (non-blocking while the tree stabilizes)
        continue-on-error: true
        run: |
          cd frontend
          npm ci || npm install
          npx tsc --noEmit || true
          npx eslint . || true
