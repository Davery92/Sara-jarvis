##
## ⚠  ARCHIVED 2026-10-01. Was docker-compose.yml at the repo root.
##    NOT USED BY PRODUCTION, AND NOT A WAY TO RUN IT.
##
## Production has not read this file since the 2026-09-29 pin. It is operated as
##   docker-compose.dev.yml + docker-compose.incident-recovery.yml
## through `scripts/sara-prod` only — see RECOVERY.md.
##
## Why it was archived rather than fixed: while it sat at the repo root it was
## the file a BARE `docker compose` resolved, into project `jarvis` — production.
## Its `backend` service has no `image:` (so it builds from the working tree) and
## no read-only `app/` mount (so the pin is absent), which made
## `docker compose up -d backend` a one-command reproduction of the 2026-09-29
## incident. scripts/rebuild_backend.sh and scripts/quick_rebuild_backend.sh did
## exactly that; both now refuse. Moving the file out of the default-resolution
## path is the other half of closing that off: a bare `docker compose` in this
## repo now finds no configuration file and fails outright.
##
## Its orphan-queue defect is DELIBERATELY NOT FIXED — see below. Repairing it
## would re-legitimize this file as a way to run production, which is the exact
## incident class the pin prevents. It is kept broken, and kept here, as a
## record of what the topology used to claim.
##
## One service was NOT archived with it: `pi-dashboard` was defined only here
## and was running continuously, so its definition moved into
## docker-compose.dev.yml rather than being stranded. The copy below is dead.
##
## It is the older "production" definition and it has drifted behind
## docker-compose.dev.yml. Production is actually operated as
##   docker-compose.dev.yml + docker-compose.incident-recovery.yml
## through `scripts/sara-prod` — see RECOVERY.md. Nothing runs from this file
## today, and `scripts/deploy_production.sh`, which would use it, refuses by
## default because doing so would rebuild from the working tree and drop the
## recovery pin.
##
## Which file is authoritative for what:
##   * service topology, celery lanes, images      -> docker-compose.dev.yml
##   * what production actually runs (image + pin) -> docker-compose.incident-recovery.yml
##   * this file                                   -> archived, dead, unverified
##
## Known drift from dev, as of 2026-09-30 (NOT fixed here on purpose — adding
## services to a production definition is David's call, not a cleanup's):
##
##   missing: acs-tool-runner, embeddings,
##            celery-critical, celery-acs, celery-david-priority
##   extra:   pi-dashboard  (dev has no pi-dashboard service)
##
## The missing celery lanes are the sharp edge. `celery-worker` here consumes
## the same seven queues as dev (cognitive, health, input, maintenance,
## low_priority, reflection, dispatch), so the `critical`, `acs` and
## `david_priority` queues would have NO CONSUMER AT ALL under this file:
## tasks routed to them enqueue and are never executed, silently. `celery-beat`
## also omits dev's `-s /tmp/celerybeat-schedule`.
##
## Do not bring this up to "restore production". Use scripts/sara-prod.
##
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "6gb", "--maxmemory-policy", "allkeys-lfu"]
    restart: unless-stopped
    volumes:
      - /data/redis:/data
    ports:
      - "6379:6379"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL-}
        VITE_ASSISTANT_NAME: Sara
        VITE_DOMAIN: sara.avery.cloud
        VITE_API_DOMAIN: sara-api.avery.cloud
        VITE_WORKBENCH_URL: ${VITE_WORKBENCH_URL-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - VITE_SPRITE_BUS=true
      - VITE_ASSISTANT_NAME=Sara
      - VITE_DOMAIN=${VITE_DOMAIN-sara.avery.cloud}
      - VITE_API_DOMAIN=${VITE_API_DOMAIN-sara-api.avery.cloud}
      - VITE_WORKBENCH_URL=${VITE_WORKBENCH_URL-}
      - VITE_ALLOWED_HOSTS=sara.avery.cloud,localhost,10.185.1.180
    depends_on:
      - backend

  canvas:
    build:
      context: ./workbench-canvas
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    restart: unless-stopped
    volumes:
      - ./workbench-canvas:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file: .env
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL-http://10.185.1.8:4000}
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=${AI_PROVIDER-gemini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL-https://generativelanguage.googleapis.com/v1beta/openai}
      - OPENAI_MODEL=${OPENAI_MODEL-gemini-3-flash-preview}
      - OPENAI_API_KEY=${GEMINI_API_KEY}
      - FAST_MODEL_URL=https://generativelanguage.googleapis.com/v1beta/openai
      - FAST_MODEL=gemini-3-flash-preview
      - FAST_MODEL_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL-http://10.185.1.8:8100}
      - EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIM=1024
      - ASSISTANT_NAME=Sara
      - DOMAIN=${DOMAIN-sara.avery.cloud}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN-.avery.cloud}
      - CORS_ORIGINS=["https://sara.avery.cloud","http://sara.avery.cloud","https://canvas.avery.cloud","http://canvas.avery.cloud","https://dash.avery.cloud","http://dash.avery.cloud","https://sara-api.avery.cloud","http://10.185.1.188:3000","http://10.185.1.180:3000","http://localhost:3000","http://10.185.1.180:3001","http://localhost:3001","http://10.185.1.180:3002","http://localhost:3002"]
      - DATABASE_URL=${DATABASE_URL-postgresql+psycopg://sara:sara123@10.185.1.180:5432/sara_hub}
      - JARVIS_MODE=true
      - SOLO_USER_ID=64f37c56-85cb-4590-8de9-adfc17d343ed
      - GRAPH_BACKEND=neo4j
      - MINIO_URL=http://minio:9000
      - MINIO_BUCKET=sara-docs
      - MINIO_ACCESS_KEY=sara
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - TIMEZONE=America/New_York
      - NEO4J_URI=${NEO4J_URI-bolt://neo4j:7687}
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - USDA_API_KEY=${USDA_API_KEY}
      - FATSECRET_CLIENT_ID=${FATSECRET_CLIENT_ID}
      - FATSECRET_CLIENT_SECRET=${FATSECRET_CLIENT_SECRET}
      # Microsoft Graph API credentials for email integration
      - MSGRAPH_CLIENT_ID=${MSGRAPH_CLIENT_ID}
      - MSGRAPH_CLIENT_SECRET=${MSGRAPH_CLIENT_SECRET}
      - MSGRAPH_TENANT_ID=${MSGRAPH_TENANT_ID}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    volumes:
      - backend_data:/app/data
      - ./data:/home/david/jarvis/data
      # Fleet-agent deploy files so /api/fleet/install.sh can serve them
      - ./deploy:/app/deploy:ro
      # Sara's self-model documents. The build context is ./backend, so docs/
      # is not in the image and SELF_MODEL_DIR (/docs) does not exist without
      # this — get_self_knowledge errors and the nightly regeneration no-ops.
      - ./docs:/docs
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_started

  pi-dashboard:
    build: ./pi-dashboard
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - VITE_API_URL=https://sara-api.avery.cloud
      - VITE_ASSISTANT_NAME=Sara
    depends_on:
      - backend

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sara_hub
      POSTGRES_USER: sara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: sara
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  neo4j:
    image: neo4j:5.15-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_import_file_use__neo4j__config: 'true'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1;"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  # Celery Worker - processes background tasks
  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q cognitive,health,input,maintenance,low_priority,reflection,dispatch
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=${AI_PROVIDER-gemini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL-https://generativelanguage.googleapis.com/v1beta/openai}
      - OPENAI_MODEL=${OPENAI_MODEL-gemini-3-flash-preview}
      - OPENAI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL-http://10.185.1.8:8100}
      - EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIM=1024
      - DATABASE_URL=${DATABASE_URL-postgresql+psycopg://sara:sara123@10.185.1.180:5432/sara_hub}
      - SOLO_USER_ID=64f37c56-85cb-4590-8de9-adfc17d343ed
      - TIMEZONE=America/New_York
      - TZ=America/New_York
      - CELERY_WORKER_QUEUES=cognitive,health,input,maintenance,low_priority,reflection
    volumes:
      # The nightly truth-maintenance job rewrites the generated sections of
      # the self-model docs, and it runs on this worker's `maintenance` queue.
      - ./docs:/docs
    depends_on:
      - redis
      - db

  # Celery Beat - schedules periodic tasks
  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SOLO_USER_ID=64f37c56-85cb-4590-8de9-adfc17d343ed
      - TIMEZONE=America/New_York
      - TZ=America/New_York
    volumes:
      - ./docs:/docs
    depends_on:
      - redis
      - celery-worker

volumes:
  postgres_data:
  minio_data:
  backend_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
