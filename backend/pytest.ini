[pytest]
asyncio_mode = auto
testpaths = tests
# Study/acceptance runs freeze a FULL source snapshot (including its own
# tests/conftest.py) under tests/**/artifacts/. Collecting those shadows the
# real tests.conftest module and aborts the whole run with
# ImportPathMismatchError — which is what happened to the first
# reliable-assistant baseline attempt on 2026-09-28. They are recorded
# evidence, never tests to run.
norecursedirs = artifacts source_snapshot .git .pytest_cache __pycache__ node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    asyncio: marks tests as async
    integration: marks tests as integration tests
    slow: marks tests as slow running
