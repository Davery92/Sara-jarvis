# Sara Voice + Vision Agent Configuration
# All IPs, thresholds, model paths, and timeouts in one place.

service:
  name: "sara-voice"
  log_level: "INFO"       # DEBUG, INFO, WARNING, ERROR
  log_file: "logs/sara-voice.log"

audio:
  # "pulse" not "AIRHUG" — PipeWire holds the AIRHUG's raw ALSA device
  # (hw:0,0) exclusively on this box, so opening it directly fails with
  # "AlsaOpen ... failed". Going through PipeWire's pulse-compat device
  # instead requires `pactl set-default-source
  # alsa_input.usb-Generic_AIRHUG_21_AIRHUG_21-00.analog-stereo` (already
  # set on david-jetson / 10.185.1.84) so "pulse" resolves to the AIRHUG mic.
  input_device: "pulse"
  # Wait this long for the "pulse" device to appear before falling back. Right
  # after a service restart the user PipeWire/pulse session can be briefly
  # unreachable; 30s wasn't always enough, so give it a minute.
  device_wait_seconds: 60
  fallback_device: "OBSBOT"      # Camera mic fallback
  # AIRHUG reports 0 output channels on this hardware (capture-only in
  # practice) — local playback isn't possible until/unless that's confirmed
  # otherwise, so TTS relays to the desktop app instead (tts.sink below).
  output_device: "pulse"
  sample_rate: 48000             # Native mic rate
  target_rate: 16000             # Downsampled for models
  channels: 1                    # Mono after downmix
  block_size: 1024               # Frames per callback
  ring_buffer_seconds: 30        # Rolling audio buffer

noise_gate:
  enabled: false
  floor_db: -50                  # Noise floor estimate (dBFS)
  attack_ms: 5                   # Gate open speed
  release_ms: 100                # Gate close speed
  adaptive: true                 # Track ambient level (runs even with enabled: false)
  ambient_window_seconds: 10     # Window for ambient estimation
  ambient_db_floor: -35          # Above this, ambient mode activates (B2.4) — TV/music, not a quiet room

wake_word:
  model_path: "models/hey_sara.onnx"
  # Tuned live on the Jetson 2026-02-23 to stop TV/music/keyboard false wakes
  # while keeping fast response. Do NOT drop threshold to the 0.5 default —
  # it will false-wake with ambient audio.
  threshold: 0.86                # Base detection threshold (field-tuned)
  ambient_threshold_boost: 0.15  # Added when music/TV detected
  refractory_seconds: 2.0        # Minimum gap between triggers
  chunk_size: 1280               # 80ms at 16kHz
  consecutive_hits_required: 1   # Maintain fast wake response
  min_chunk_rms: 0.010           # Keep click/keyboard false-wake filter
  min_rms_hits_required: 1       # Require energy on detection chunk
  allowed_model_names:
    - "hey_sara"

vad:
  model_path: "models/silero_vad.onnx"
  threshold: 0.5                 # Speech probability threshold
  min_speech_ms: 250             # Ignore shorter than this
  max_silence_ms: 300            # End-of-speech silence
  max_speech_seconds: 30         # Hard cutoff for single utterance
  pre_speech_pad_ms: 300         # Include audio before speech onset

stt:
  remote_url: "http://10.185.1.8:8585/v1/audio/transcriptions"
  remote_timeout_seconds: 20
  remote_retries: 1
  local_model_path: "models/ggml-base.en.bin"
  local_threads: 4
  language: "en"
  use_local_fallback: true       # Fall back to local on remote failure

speaker_verification:
  enabled: true                  # NeMo/speechbrain verify service verified healthy 2026-07-18
  url: "http://10.185.1.8:8002"
  endpoint: "/verify-upload"
  speaker_id: "david"
  threshold: 0.60
  timeout_seconds: 6
  # Short near-field utterances often miss the strict threshold — allow a
  # narrow override when the clip is short, loud, and near a match.
  short_utterance_max_seconds: 1.8
  short_utterance_min_confidence: 0.55
  short_utterance_min_rms: 0.015
  # First-turn-after-wake override: a strong "hey sara" is itself evidence the
  # first turn is David, so accept the first turn even if the (short, cold)
  # verification just missed. Only consulted when require_target_speaker: true.
  first_turn_after_wake_override_enabled: true
  first_turn_after_wake_max_age_seconds: 20.0
  first_turn_after_wake_min_rms: 0.03
  first_turn_after_wake_min_confidence: -1.0
  first_turn_after_wake_min_wake_score: 0.96
  first_turn_after_wake_min_wake_rms: 0.05

conversation:
  wake_confirmation_ms: 300      # Ding/flash duration
  listen_timeout_seconds: 30     # Max listening time
  processing_timeout_seconds: 30 # Max wait for backend response
  cooldown_seconds: 5            # Pause between turns
  max_turns: 20                  # Max turns before forced idle
  allow_followup_without_wake_word: true  # Follow-up turns don't need re-wake
  # Start permissive: attribute-but-don't-gate on speaker identity. Flip to
  # true once the verifier is trusted to stop non-David voices driving replies.
  require_target_speaker: false
  target_speaker: "david"        # Expected speaker label
  goodbye_phrases:
    - "goodbye"
    - "bye sara"
    - "that's all"
    - "stop"
    - "never mind"
    - "thanks sara"
  barge_in:
    enabled: true
    confidence_threshold: 0.7            # Sustained Silero VAD speech probability (B2.3)
    min_duration_ms: 300                 # Must sustain for this long
    ambient_confidence_boost: 0.15       # Extra required confidence while ambient mode is active (B2.4)
    ambient_min_duration_boost_ms: 200   # Extra required sustain time while ambient mode is active
  watchdog:
    max_consecutive_unverified_turns: 4  # B2.7 loop breaker
    max_turns_per_window: 8
    window_seconds: 180
    suppress_seconds: 60

echo:
  tail_suppression_ms: 500       # Suppress after Sara stops speaking
  reference_delay_ms: 50         # Expected latency from TTS to speaker

backend:
  base_url: "http://10.185.1.180:8000"
  voice_chat_endpoint: "/api/pi-dashboard/voice/chat"
  use_device_token_auth: true
  device_bootstrap_endpoint: "/api/devices/bootstrap"
  device_name: "jetson-voice"
  device_type: "jetson_voice"
  raw_buffer_endpoint: "/api/cognitive/raw-buffer/audio"
  sensory_base: "/api/sensory"
  auth:
    username: ""                 # Set via environment: SARA_USERNAME
    password: ""                 # Set via environment: SARA_PASSWORD

tts:
  url: "http://10.185.1.9:8880"
  voice: "af_heart"
  speed: 1.0
  sentence_pause_ms: 150         # Pause between sentences
  format: "pcm"                  # Raw PCM for low latency
  # airhug | desktop | both — D3 default was "airhug", but on david-jetson
  # (10.185.1.84) the AIRHUG reports 0 output channels, so local playback
  # isn't possible there. "desktop" relays TTS audio to the paired desktop
  # app instead. Switch back to "airhug" (or "both") if a real speaker gets
  # confirmed on that output.
  sink: "desktop"

desktop_bridge:
  host: "0.0.0.0"
  port: 8765
  reconnect_interval_seconds: 5
  audio_format:
    sample_rate: 24000
    channels: 1
    dtype: "int16"

vision:
  # Disabled for the desk-voice phase — vision drags in InsightFace/TensorRT
  # and the OBSBOT camera as extra failure modes. Re-enable as its own
  # follow-up once voice is solid.
  enabled: false
  camera_device: 0               # /dev/video0
  camera_name: "OBSBOT"          # Substring match for V4L2
  resolution: [1280, 720]        # 720p
  fps: 15
  face_detection:
    interval_seconds: 5          # Run detection every N seconds
    model: "buffalo_sc"          # InsightFace model
    tensorrt: true               # Use TensorRT engine
    confidence_threshold: 0.5
    david_embedding_path: "models/david_face.npy"
    similarity_threshold: 0.4    # Cosine similarity for David match
  presence:
    absent_timeout_seconds: 60   # No face → absent
    present_cooldown_seconds: 10 # Debounce present→absent

gpu:
  pre_allocate: true
  cuda_device: 0
  memory_pool_mb: 512            # Pre-allocated CUDA memory pool
  priority:
    # P0: always available (CPU — wake word, VAD)
    # P1: face detection (GPU, every 5s)
    # P2: local STT fallback (GPU, on demand)
    face_detection: 1
    local_stt: 2

health:
  report_interval_seconds: 60
  watchdog_interval_seconds: 30  # sd_notify interval
  endpoint: "/api/sensory/jetson/health"
