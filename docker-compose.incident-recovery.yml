##
## Production pin — generation 3, cut 2026-09-30.
##
## Generation 1 (2026-09-29, sara-reliable-candidate:20260929, frozen at
## /home/david/sara-candidate-20260928-reliable) was the incident exit: those
## bytes were already in production because a reboot put them there, and pinning
## them was the safe move, not a deployment decision. Its source was never in
## git — the working tree it came from was uncommitted.
##
## Generation 2 was the first pin cut from a COMMITTED tree, and it shipped 13
## imports the monolith extraction had dropped: /api/health/sync-recovery 500'd
## in production with "name 'local_today' is not defined", and
## /analytics/dashboard and pi-dashboard voice/transcribe carried the same defect
## latently. Generation 3 is that fix (34c68408) plus the static gate that would
## have caught it, backend/scripts/check_extracted_route_names.py, and an
## execution pass that actually calls every extracted endpoint. Both generations
## sit on the SAME schema, so this was a source-only roll-forward.
##
## Generation 3 is cut from a COMMITTED tree (git 34c68408 on
## feat/sara-mind-v2), after the 2026-09-30 codebase cleanup. Same schema: the
## cleanup added no migrations, so 158_reminder_delivery_state is unchanged and
## no migration ran at cutover. Verified before cutover by
## backend/scripts/rehearse_reliable_release.sh on disposable databases —
## release path, recovery destination, and the four-capability readiness probe
## (READY) — plus the full pytest suite and tests/replay diffed against
## generation 1 for regressions.
##
## The tag ends in 'b' because the first build of this generation FAILED the
## rehearsal: llm_broker.resolve() ignored the environment, so an isolated stack
## could not reach its own embeddings host and the probe could not write a note.
## Fixed in c3cc16dc; the pre-fix image was deleted rather than left lying
## around one character away from this one.
##
## Overlay on docker-compose.dev.yml. It exists because a reboot restarted
## `backend` over its `./backend:/app` bind mount and thereby put the MUTABLE
## working tree into production against schema 154, which that code cannot run
## on (`_is_revoked` fails closed -> every authenticated request 401s). The
## overlay only applies when it is NAMED, which is why `scripts/sara-prod` is
## the only supported way to operate this stack.
##
## This pins the API and every worker to ONE immutable artifact whose code was
## hashed against its manifest from inside the container:
##
##   image  sara-cleanup-candidate:20260930c
##          sha256:3392120f0d9ae1f34a38d745b8c4d51a83bc9497a118e3b64710a8499238aa9e
##   code   912/912 files == CANDIDATE_MANIFEST.sha256
##          hash 5fa0da0cc448fe7205a8f8439daa7a398f320fc4c7e33fb98a14dafa15702f9a
##   schema 158_reminder_delivery_state — UNCHANGED from generation 1, so
##          nothing was migrated at cutover and there is no schema step to undo
##
## Unlike generation 1, this IS a deliberate deployment of changed code: 912
## files against generation 1's 916, with the cleanup's deletions, renames and
## route extractions in them. The bytes were never in production before. That
## is why it was gated by a full rehearsal rather than simply pinned.
##
## Rollback, should it be needed: generation 1 is still intact — image
## sara-reliable-candidate:20260929 and frozen tree
## /home/david/sara-candidate-20260928-reliable — and runs on this SAME schema,
## so reverting is this file's two values plus `scripts/sara-prod up`, with no
## migration in either direction. That is the first rollback this project has
## had that does not require a database change.
##
## Usage (BOTH -f flags, in this order, every time):
##   docker compose -f docker-compose.dev.yml -f docker-compose.incident-recovery.yml up -d <svc>
services:
  backend:
    image: sara-cleanup-candidate:20260930c
    volumes:
      # Replaces `./backend:/app`. The application code now comes from the
      # image; nothing maps the working tree over it any more.
      - /home/david/sara-candidate-20261001-fix/backend/app:/app/app:ro
      - /home/david/sara-candidate-20261001-fix/backend/alembic:/app/alembic:ro

  celery-worker: &pinned
    image: sara-cleanup-candidate:20260930c
    volumes:
      - /home/david/sara-candidate-20261001-fix/backend/app:/app/app:ro
      - /home/david/sara-candidate-20261001-fix/backend/alembic:/app/alembic:ro

  celery-critical: *pinned
  celery-david-priority: *pinned
  celery-acs: *pinned
  celery-beat: *pinned
